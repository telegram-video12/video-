<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>כניסה · הספרייה שלי</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-page">
    <form class="login-card" id="f">
      <div class="logo"><span class="dot"></span> הספרייה שלי</div>
      <input class="input" type="password" id="pw" placeholder="סיסמה" autocomplete="current-password" autofocus>
      <button class="btn primary" type="submit">כניסה</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const r = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: document.getElementById('pw').value})
      });
      if (r.ok) location.href = '/';
      else err.textContent = (await r.json().catch(() => ({}))).detail || 'שגיאה';
    });
  </script>
</body>
</html>
