  <script>
    (function () {  // once per visit, never in a page reload; quieter for "reduce motion"
      var s = document.getElementById('splash'), seen = false;
      try { seen = sessionStorage.getItem('splash') === '1'; sessionStorage.setItem('splash', '1'); } catch (e) {}
      if (seen) { s.remove(); return; }
      var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var end = function () { if (!s.isConnected || s.classList.contains('out')) return; s.classList.add('out'); setTimeout(function () { s.remove(); }, 650); };
      s.addEventListener('click', end);
      setTimeout(end, calm ? 600 : 2500);
    })();
  </script>
